$kind: http-request
description: Requires `groupId` from **List avatar groups (public)**. Test script saves first look `id` to **`avatarLookId`** — pass that as `avatarId` on **Create avatar video** (HeyGen look id, not group id).
url: "{{baseUrl}}/api/heygen/avatars/looks?group_id={{groupId}}&avatar_type=studio_avatar&limit=20"
method: GET
queryParams:
  group_id: "{{groupId}}"
  avatar_type: studio_avatar
  limit: "20"
scripts:
  - type: afterResponse
    code: |-
      function firstLookId(root) {
        const KEYS = ['looks','avatar_looks','avatars','list','items','data'];
        function walk(n, d) {
          if (d > 10 || n == null) return null;
          if (Array.isArray(n)) { for (const it of n) { if (it && it.id) return String(it.id); } return null; }
          if (typeof n !== 'object') return null;
          for (const k of KEYS) { if (Array.isArray(n[k]) && n[k][0] && n[k][0].id) return String(n[k][0].id); }
          if (n.data) { const x = walk(n.data, d + 1); if (x) return x; }
          for (const k of KEYS) { if (n[k]) { const x = walk(n[k], d + 1); if (x) return x; } }
          return null;
        }
        return walk(root, 0);
      }
      try {
        const j = pm.response.json();
        const lid = firstLookId(j.data);
        if (lid) pm.collectionVariables.set('avatarLookId', lid);
      } catch (e) {}
    language: text/javascript
order: 4000
