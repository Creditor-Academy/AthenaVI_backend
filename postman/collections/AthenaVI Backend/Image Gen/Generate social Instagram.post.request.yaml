$kind: http-request
url: "{{baseUrl}}/api/image-gen/workspaces/{{workspaceId}}/generate"
method: POST
body:
  type: json
  data: |-
    {
      "mode": "social",
      "modelId": "gpt-image-1",
      "formatId": "instagram_post",
      "style": "corporate",
      "prompt": "Product launch promo for Athena VI virtual instructor. Full-bleed square. Headline and subheadline are supplied separately — keep the scene clean for overlay text.",
      "headline": "Create courses faster",
      "subheadline": "AI-powered instructor studio",
      "textMode": "overlay",
      "brandPalette": ["#0B1F3A", "#3DDC97"]
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const j = pm.response.json();
        const id = j && j.data && j.data.generation && j.data.generation.id;
        if (id) {
          pm.collectionVariables.set("generationId", id);
          pm.environment.set("generationId", id);
          pm.environment.set("imageGenerationId", id);
        }
      }
    language: text/javascript
order: 3100
