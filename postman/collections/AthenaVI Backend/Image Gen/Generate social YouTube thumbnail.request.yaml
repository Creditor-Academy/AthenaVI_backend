$kind: http-request
description: YouTube 1280x720 thumbnail. formatId is required for social. Allow a long timeout.
url: "{{baseUrl}}/api/image-gen/workspaces/{{workspaceId}}/generate"
method: POST
body:
  type: json
  data: |-
    {
      "mode": "social",
      "modelId": "gpt-image-1",
      "formatId": "youtube_thumbnail",
      "style": "corporate",
      "prompt": "Clickable YouTube thumbnail for an Athena VI product walkthrough. Huge high-contrast title, full-bleed 16:9, readable at small size, no empty bars.",
      "headline": "Ship courses 10x faster",
      "subheadline": "Athena VI",
      "textMode": "baked",
      "brandPalette": ["#0B1F3A", "#3DDC97"]
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const j = pm.response.json();
        const id = j && j.data && j.data.generation && j.data.generation.id;
        if (id) {
          pm.collectionVariables.set("generationId", id);
          pm.environment.set("generationId", id);
          pm.environment.set("imageGenerationId", id);
        }
      }
    language: text/javascript
order: 3110
