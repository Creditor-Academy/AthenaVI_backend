$kind: http-request
description: LinkedIn profile banner 1584x396. Keep left ~25% clear for avatar overlap.
url: "{{baseUrl}}/api/image-gen/workspaces/{{workspaceId}}/generate"
method: POST
body:
  type: json
  data: |-
    {
      "mode": "social",
      "modelId": "gpt-image-1",
      "formatId": "linkedin_banner",
      "style": "corporate",
      "prompt": "Ultra-wide LinkedIn profile banner for Athena VI. Full-bleed texture left to right. Left 25% low-contrast only (profile photo overlap). Headline center-right.",
      "headline": "Virtual instructor studio",
      "subheadline": "Athena VI",
      "textMode": "overlay",
      "brandPalette": ["#0B1F3A", "#3DDC97"]
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const j = pm.response.json();
        const id = j && j.data && j.data.generation && j.data.generation.id;
        if (id) {
          pm.collectionVariables.set("generationId", id);
          pm.environment.set("generationId", id);
          pm.environment.set("imageGenerationId", id);
        }
      }
    language: text/javascript
order: 3120
