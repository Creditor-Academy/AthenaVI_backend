$kind: http-request
name: Send thread message social visual edit
url: "{{baseUrl}}/api/image-gen/workspaces/{{workspaceId}}/threads/{{imageGenThreadId}}/messages"
method: POST
body:
  type: json
  data: |-
    {
      "content": "Make the background darker and add a soft glow behind the subject",
      "editMode": "pixel"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const j = pm.response.json();
        const id = j && j.data && j.data.generation && j.data.generation.id;
        if (id) {
          pm.collectionVariables.set("generationId", id);
          pm.environment.set("generationId", id);
          pm.environment.set("imageGenerationId", id);
        }
      }
    language: text/javascript
order: 3420
