$kind: http-request
url: "{{baseUrl}}/api/image-gen/workspaces/{{workspaceId}}/generate"
method: POST
body:
  type: json
  data: |-
    {
      "mode": "printable",
      "folderId": "{{folderId}}",
      "formatId": "poster-a4-portrait",
      "styleHint": "modern, bold typography, deep navy and gold",
      "brandPalette": ["#0B1F3A", "#E0B04B"],
      "prompt": "Poster for the Athena Learning Summit, 14-15 November 2026 at Bengaluru International Centre. Two days of hands-on AI teaching workshops. Register at athenavi.com/summit"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const j = pm.response.json();
        const id = j && j.data && j.data.generation && j.data.generation.id;
        const threadId = j && j.data && j.data.thread && j.data.thread.id;
        if (id) {
          pm.collectionVariables.set("generationId", id);
          pm.environment.set("generationId", id);
          pm.environment.set("imageGenerationId", id);
        }
        if (threadId) {
          pm.collectionVariables.set("imageGenThreadId", threadId);
          pm.environment.set("imageGenThreadId", threadId);
        }
      }
    language: text/javascript
order: 3170
