$kind: collection
description: |-
  AI Image Gen (OpenAI): models/formats/styles catalogs, context bundles, generate into a folder chat, thread messages (tweak latest hop), regenerate, download (png/jpg/pdf).

  Requires `OPENAI_API_KEY` and `folderId` on generate. Charges workspace credits on success (context create, open chat, and downloads are free).

  Mode is `image` only. Prompt is required (max 16,000 chars). Formats: square, landscape, portrait.

  After generate/create-context, test scripts save `generationId` / `imageGenThreadId` / `imageGenContextId`.
auth:
  - id: image-gen-bearer-auth
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
order: 8500
