$kind: collection
description: |-
  AI Image Gen (OpenAI): models/formats/styles catalogs, context bundles (docs/refs), generate (image/infographic/social), regenerate, tweak, download (png/jpg/pdf).

  Requires `OPENAI_API_KEY`. Charges workspace credits on success (context create is free). Downloads are free.

  Infographic default model is `gpt-image-1-hd` (14 AC) when `modelId` is omitted. Prompt max is 16,000 chars. Infographic structured form: up to 24 sections.

  After generate/create-context, test scripts save `generationId` / `imageGenContextId`.
auth:
  - id: image-gen-bearer-auth
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
order: 8500
