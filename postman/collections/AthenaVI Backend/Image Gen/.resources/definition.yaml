$kind: collection
description: |-
  AI Image Gen (OpenAI): models/formats/styles catalogs, context bundles (docs/refs), generate (image), regenerate, tweak, download (png/jpg/pdf).

  Requires `OPENAI_API_KEY`. Charges workspace credits on success (context create is free). Downloads are free.

  Mode is `image` only. Prompt is required (max 16,000 chars). Formats: square, landscape, portrait.

  After generate/create-context, test scripts save `generationId` / `imageGenContextId`.
auth:
  - id: image-gen-bearer-auth
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
order: 8500
