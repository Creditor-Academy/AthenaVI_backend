$kind: http-request
description: HD default for infographic. Allow 90–180s. Response may include generation.infographicQuality.
url: "{{baseUrl}}/api/image-gen/workspaces/{{workspaceId}}/generate"
method: POST
body:
  type: json
  data: |-
    {
      "mode": "infographic",
      "formatId": "landscape",
      "style": "flat_illustration",
      "prompt": "Customer onboarding funnel for Athena VI. Flat vector, numbered steps, large readable labels, brand palette navy and teal.",
      "brandPalette": ["#0B1F3A", "#3DDC97"],
      "infographic": {
        "layout": "process",
        "title": "Onboarding",
        "sections": [
          {
            "title": "Sign up",
            "content": "Create an account and verify email so the workspace is ready.",
            "bullets": ["Create account", "Verify email"]
          },
          {
            "title": "Setup",
            "content": "Pick a workspace and invite the first teammates.",
            "bullets": ["Pick workspace", "Invite team"]
          },
          {
            "title": "Create",
            "content": "Start the first project and publish a course.",
            "bullets": ["First project", "Publish"]
          }
        ]
      }
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const j = pm.response.json();
        const id = j && j.data && j.data.generation && j.data.generation.id;
        if (id) {
          pm.collectionVariables.set("generationId", id);
          pm.environment.set("generationId", id);
          pm.environment.set("imageGenerationId", id);
        }
      }
    language: text/javascript
order: 3200
