$kind: http-request
description: "PATCH full V2 editor `data`: scene `presenter` / `generation`, element `style`, `filters`, `timing` or flat `startFrame`, `clips` alias for `elements`. Server keeps all fields (no strip). HeyGen: `generation.heygenVideoId` + `presenter.script` / `avatarId` / `voiceId`. Do not persist `blob:` or `generatedVideoUrl` for playback. Sample body uses legacy flat shape; frontend may send richer V2 per README."
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/projects/{{projectId}}/data"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "data": {
        "videoSettings": {
          "width": 1920,
          "height": 1080,
          "fps": 30,
          "backgroundColor": "#000000"
        },
        "scenes": [
          {
            "sceneId": "scene_001",
            "name": "Intro Scene",
            "durationInFrames": 150,
            "background": {
              "type": "color",
              "value": "#101828"
            },
            "transition": {
              "in": {
                "type": "fade",
                "durationInFrames": 12,
                "easing": "easeOut"
              },
              "out": {
                "type": "slide-left",
                "durationInFrames": 12,
                "easing": "easeInOut"
              }
            },
            "elements": [
              {
                "id": "text_001",
                "type": "text",
                "layer": 20,
                "startFrame": 0,
                "durationInFrames": 120,
                "placement": {
                  "x": 120,
                  "y": 120,
                  "width": 760,
                  "height": 180,
                  "rotation": 0,
                  "scale": 1,
                  "opacity": 1
                },
                "content": {
                  "text": "Welcome",
                  "fontFamily": "Inter",
                  "fontSize": 64,
                  "fontWeight": 700,
                  "color": "#FFFFFF",
                  "textAlign": "left"
                },
                "animations": [
                  {
                    "type": "slide-up",
                    "startFrame": 8,
                    "durationInFrames": 18,
                    "distance": 40,
                    "easing": "easeOut"
                  },
                  {
                    "type": "fade-in",
                    "startFrame": 8,
                    "durationInFrames": 18,
                    "easing": "easeOut"
                  }
                ]
              },
              {
                "id": "avatar_001",
                "type": "avatar",
                "layer": 10,
                "startFrame": 0,
                "durationInFrames": 150,
                "placement": {
                  "x": 1180,
                  "y": 180,
                  "width": 520,
                  "height": 820,
                  "rotation": 0,
                  "scale": 1,
                  "opacity": 1
                },
                "content": {
                  "provider": "heygen",
                  "sceneId": "scene_001",
                  "avatarId": "{{avatarLookId}}",
                  "voiceId": "{{voiceId}}",
                  "script": "Welcome to our platform.",
                  "heygenVideoId": "{{heygenVideoId}}"
                },
                "animations": [
                  {
                    "type": "fade-in",
                    "startFrame": 0,
                    "durationInFrames": 10,
                    "easing": "easeOut"
                  }
                ]
              },
              {
                "id": "image_001",
                "type": "image",
                "layer": 5,
                "startFrame": 0,
                "durationInFrames": 150,
                "placement": {
                  "x": 0,
                  "y": 0,
                  "width": 1920,
                  "height": 1080,
                  "rotation": 0,
                  "scale": 1,
                  "opacity": 1
                },
                "content": {
                  "assetId": "{{assetId}}",
                  "fit": "cover"
                },
                "animations": [
                  {
                    "type": "zoom-in",
                    "startFrame": 0,
                    "durationInFrames": 150,
                    "fromScale": 1,
                    "toScale": 1.08,
                    "easing": "linear"
                  }
                ]
              }
            ]
          }
        ]
      }
    }
order: 6000
