$kind: http-request
description: Email/password accounts only. Requires currentPassword and newPassword (min 6 chars).
url: "{{baseUrl}}/api/user/settings/security/password"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "new-password123"
    }
order: 6000
