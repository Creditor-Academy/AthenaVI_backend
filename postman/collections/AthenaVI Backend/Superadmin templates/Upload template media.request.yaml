$kind: http-request
url: "{{baseUrl}}/api/superadmin/templates/{{deckPackTemplateId}}/media"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  formdata:
    - key: file
      type: file
      src: "{{templateMediaFile}}"
    - key: kind
      value: preview
    - key: slotHint
      value: preview
    - key: setAsPreview
      value: "true"
    - key: name
      value: Pack preview
order: 4020
