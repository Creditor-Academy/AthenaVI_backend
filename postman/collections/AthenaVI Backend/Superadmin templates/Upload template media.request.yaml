$kind: http-request
url: "{{baseUrl}}/api/superadmin/templates/{{deckPackTemplateId}}/media"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  formdata:
    - key: file
      type: file
      src: "{{templateMediaFile}}"
    - key: kind
      value: preview
    - key: slotHint
      value: preview
    - key: setAsPreview
      value: "true"
    - key: name
      value: Pack preview
scripts:
  - type: afterResponse
    code: |-
      try {
        const j = pm.response.json();
        const media = j.data && j.data.media;
        const id = media && media.id;
        if (id) pm.collectionVariables.set("templateMediaId", id);
      } catch (e) {}
    language: text/javascript
order: 4020
