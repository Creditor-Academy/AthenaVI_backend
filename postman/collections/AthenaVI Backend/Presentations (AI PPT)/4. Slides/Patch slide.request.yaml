$kind: http-request
description: |
  Patch slide fields. progressStatus: TODO | IN_PROGRESS | COMPLETED | null (clear).
  Progress-only body does not set manuallyEdited. Example below sets progress; for content edits include content/elements as needed.
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/slides/{{slideId}}"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "progressStatus": "IN_PROGRESS"
    }
order: 6000
