$kind: http-request
description: >
  TEAM only. OWNER/ADMIN assign or unassign one slide. Body assigneeId = workspace member user.id
  (from GET .../members), or null to unassign. Does not change who can open/edit the deck.
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/slides/{{slideId}}/assignee"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "assigneeId": "{{userId}}"
    }
order: 8000
