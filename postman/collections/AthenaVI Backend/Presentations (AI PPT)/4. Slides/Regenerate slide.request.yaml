$kind: http-request
description: Optional prompt seeds AI when deck has no outline. content/all require prompt or existing title.
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/slides/{{slideId}}/regenerate"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "target": "all",
      "overwriteManualEdits": true,
      "prompt": "Rewrite this slide as a competitive landscape for Athena VI"
    }
order: 7000
