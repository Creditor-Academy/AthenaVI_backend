$kind: http-request
description: Requires deckTemplateId from List presentation templates
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "From layout",
      "folderId": "{{folderId}}",
      "createMode": "template",
      "templateId": "{{deckTemplateId}}",
      "themeId": "midnight_blue"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const j = pm.response.json();
        const id = j && j.data && j.data.project && j.data.project.id;
        if (id) pm.collectionVariables.set("presentationId", id);
        const slides = j && j.data && j.data.deck && j.data.deck.slides;
        if (Array.isArray(slides) && slides[0]) pm.collectionVariables.set("slideId", slides[0].id);
      }
    language: text/javascript
order: 2000
