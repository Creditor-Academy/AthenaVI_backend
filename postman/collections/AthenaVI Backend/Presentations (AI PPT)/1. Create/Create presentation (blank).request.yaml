$kind: http-request
description: Title optional for AI create — omit title and let outline generate it. Saves presentationId from data.project.id
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "folderId": "{{folderId}}",
      "createMode": "blank",
      "themeId": "midnight_blue",
      "locale": "en",
      "aspectRatio": "16:9"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const j = pm.response.json();
        const id = (j && j.data && (j.data.id || (j.data.project && j.data.project.id)));
        if (id) pm.collectionVariables.set("presentationId", id);
        const slides = j && j.data && (j.data.slides || (j.data.deck && j.data.deck.slides));
        if (Array.isArray(slides) && slides[0]) pm.collectionVariables.set("slideId", slides[0].id);
      }
    language: text/javascript
order: 1000
