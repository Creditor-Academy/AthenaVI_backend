$kind: http-request
description: Active DECK_PACK multi-slide templates
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentation-deck-packs"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const j = pm.response.json();
        const packs = j && j.data && j.data.packs;
        if (Array.isArray(packs) && packs[0]) pm.collectionVariables.set("deckPackId", packs[0].id);
      }
    language: text/javascript
order: 1150
