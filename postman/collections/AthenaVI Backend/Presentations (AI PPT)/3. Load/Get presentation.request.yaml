$kind: http-request
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const j = pm.response.json();
        const slides = j && j.data && j.data.slides;
        if (Array.isArray(slides) && slides[0]) {
          pm.collectionVariables.set("slideId", slides[0].id);
          if (slides[1]) pm.collectionVariables.set("slideId2", slides[1].id);
          const els = slides[0].elements && slides[0].elements.elements;
          if (Array.isArray(els) && els[0]) {
            pm.collectionVariables.set("elementId", els[0].id);
            if (els[1]) pm.collectionVariables.set("elementId2", els[1].id);
          }
        }
      }
    language: text/javascript
order: 1000
