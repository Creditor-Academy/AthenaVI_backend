$kind: http-request
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/thumbnail/image"
method: PUT
description: |-
  Deck cover for the My Work card grid, captured by the frontend from the live preview.
  Send only when GET .../preview reports coverStale: true.
  jpeg/png/webp, max 2MB. A second upload within 10s returns { skipped: true } (success).
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  formdata:
    - key: file
      type: file
      src: "{{presentationCoverFile}}"
order: 950
