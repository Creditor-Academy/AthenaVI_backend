$kind: http-request
description: Generates outline + concise presentation title from prompt. Response data.presentation.title is saved on the project.
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/outline"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "source": "prompt",
      "prompt": "Create a presentation about AI in modern healthcare for hospital leaders",
      "slideCount": 10,
      "density": "balanced",
      "locale": "en"
    }
order: 2000
