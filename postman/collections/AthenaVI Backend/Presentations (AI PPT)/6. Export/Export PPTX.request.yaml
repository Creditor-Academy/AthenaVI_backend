$kind: http-request
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/export"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "format": "PPTX"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 202) {
        const j = pm.response.json();
        const id = j && j.data && j.data.exportId;
        if (id) pm.collectionVariables.set("exportId", id);
      }
    language: text/javascript
order: 1000
