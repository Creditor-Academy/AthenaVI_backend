$kind: http-request
description: Disable keeps the same token, so re-enabling revives the shared URL. Set expiresAt to null to clear.
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/share"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "enabled": false
    }
order: 3000
