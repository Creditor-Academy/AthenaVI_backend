$kind: http-request
description: Idempotent. Returns the raw token ONLY on first create (and on rotate).
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/share"
method: PUT
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const j = pm.response.json();
        const token = j && j.data && j.data.token;
        if (token) pm.collectionVariables.set("presentationShareToken", token);
      }
    language: text/javascript
order: 1000
