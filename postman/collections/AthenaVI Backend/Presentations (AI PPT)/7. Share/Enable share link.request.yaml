$kind: http-request
description: Idempotent. share.url is always returned when a link exists (and top-level token/url on first create).
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/share"
method: PUT
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const j = pm.response.json();
        const data = j && j.data;
        const token = (data && data.token) || (data && data.share && data.share.token);
        if (token) pm.collectionVariables.set("presentationShareToken", token);
      }
    language: text/javascript
order: 1000
