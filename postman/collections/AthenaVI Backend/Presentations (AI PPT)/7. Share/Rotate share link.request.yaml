$kind: http-request
description: Mints a new token and kills every URL already shared. Returns token/url top-level and inside share.
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/presentations/{{presentationId}}/share/rotate"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const j = pm.response.json();
        const data = j && j.data;
        const token = (data && data.token) || (data && data.share && data.share.token);
        if (token) pm.collectionVariables.set("presentationShareToken", token);
      }
    language: text/javascript
order: 4000
