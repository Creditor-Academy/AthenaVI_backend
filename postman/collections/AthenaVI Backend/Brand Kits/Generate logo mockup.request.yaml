$kind: http-request
description: Preview generate. logoPosition is forbidden on mug (400). itemColor optional hex for all templates.
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/brand-kits/{{brandKitId}}/mockups/generate"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "templateId": "mug",
      "itemColor": "#F5F5F5",
      "logoRole": "primary",
      "save": false
    }
order: 1190
