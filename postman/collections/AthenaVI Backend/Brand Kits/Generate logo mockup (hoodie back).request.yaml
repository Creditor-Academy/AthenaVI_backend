$kind: http-request
description: Apparel-only logoPosition. Canonical back value is center_back (aliases back_center, back, rear). Forbidden on non-tshirt/hoodie templates (400).
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/brand-kits/{{brandKitId}}/mockups/generate"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "templateId": "hoodie",
      "itemColor": "#1A1A1A",
      "logoRole": "white",
      "logoPosition": "center_back",
      "save": false
    }
order: 1192
