$kind: http-request
description: Published graphics only. Optional q, category, type, style, mood, colorMode, page, limit.
url: "{{baseUrl}}/api/graphics?page=1&limit=20"
method: GET
scripts:
  - type: afterResponse
    code: |-
      try {
        const j = pm.response.json();
        const items = j.data && j.data.items;
        if (items && items[0] && items[0].id) {
          pm.collectionVariables.set('graphicId', items[0].id);
        }
      } catch (e) {}
    language: text/javascript
order: 1000
