$kind: http-request
url: "{{baseUrl}}/workspaces/{{workspaceId}}/projects"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "From video template",
      "folderId": "{{folderId}}",
      "aspectRatio": "16:9",
      "templateId": "{{videoTemplateId}}"
    }
order: 3000
