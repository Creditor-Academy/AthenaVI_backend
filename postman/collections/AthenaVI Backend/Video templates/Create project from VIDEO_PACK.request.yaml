$kind: http-request
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/projects"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "From video pack",
      "folderId": "{{folderId}}",
      "aspectRatio": "16:9",
      "templateId": "{{videoPackTemplateId}}"
    }
order: 3100
